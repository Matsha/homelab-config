services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080
    volumes:
      - ./gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - FIREWALL_VPN_INPUT_PORTS=45525
#      - VPN_TYPE=wireguard
#      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
#      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
#      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - OPENVPN_CA=${OPENVPN_CA}
      - OPENVPN_CERT=${OPENVPN_CERT}
      - OPENVPN_KEY=${OPENVPN_KEY}
      - OPENVPN_TLS_CRYPT=${OPENVPN_TLS_CRYPT}
      - OPENVPN_PROTOCOL=udp
      - SERVER_NAMES=Lacerta
      - FIREWALL_OUTBOUND_SUBNETS=192.168.2.0/24
      - TZ=America/Toronto
#      - VPN_ENDPOINT_IP_FAMILY=ipv4
      - DOT=off
      - DNS_ADDRESS=1.1.1.1
#      - WIREGUARD_MTU=1320
      - HEALTH_TARGET_ADDRESS=1.1.1.1:443
      - UPDATER_PERIOD=24h
#      - HEALTH_VPN_DURATION_INITIAL=120s
      - HEALTH_SUCCESS_WAIT_DURATION=30s
#      - HEALTH_RESTART_VPN=off
    restart: unless-stopped
#    sysctls:
#     - net.ipv6.conf.all.disable_ipv6=1
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - WEBUI_PORT=8080
    volumes:
      - ./config:/config
      - /mnt/data:/data
    restart: unless-stopped
